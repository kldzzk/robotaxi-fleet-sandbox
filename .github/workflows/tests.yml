name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: python -m robotaxi_fleet analyze --city paper_baseline --json > /dev/null
      - name: Web model tests
        run: node tests/web_model.test.js
      - name: Worker memo tests
        run: node worker/test/memo.test.js
